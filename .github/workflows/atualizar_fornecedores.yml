name: Sincronizar Catálogo de Fornecedores (KaBuM, Terabyte, Pichau)

on:
  schedule:
    # Roda automaticamente às 00:00 e 12:00 no Horário de Brasília (03:00 e 15:00 UTC)
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria específica (ex: Processador, Placa de Vídeo) ou vazio para todas'
        required: false
        default: ''
      pages:
        description: 'Páginas por departamento (padrão: 1 = ~1.500 produtos)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  crawler-sync:
    name: Crawl4AI Hardware Sync
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências e Playwright Headless
        run: |
          python -m pip install --upgrade pip
          pip install crawl4ai playwright beautifulsoup4 psycopg2-binary
          python -m playwright install --with-deps chromium

      - name: Executar Crawler de Hardware (Crawl4AI)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          CMD="python scripts/crawler_fornecedores.py"
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CMD="$CMD --category '${{ github.event.inputs.category }}'"
          else
            CMD="$CMD --all"
          fi
          CMD="$CMD --pages ${{ github.event.inputs.pages || '1' }}"
          echo "Executando: $CMD"
          eval $CMD

      - name: Salvar Alterações no SQLite (se não estiver usando Supabase)
        if: env.DATABASE_URL == ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.sqlite Bios-informatica-producao/database.sqlite Bios-informatica-v1.1/database.sqlite || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteração nos preços detectada."
          else
            git commit -m "chore(crawler): atualização automática de preços e fotos dos fornecedores [skip ci]"
            git push
          fi

