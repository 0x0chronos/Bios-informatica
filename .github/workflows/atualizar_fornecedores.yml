name: Atualizar catálogo de fornecedores

on:
  schedule:
    # 00h e 12h em Brasília (UTC-3). A coleta termina depois do início agendado.
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Categoria (vazio = todas)'
        required: false
        type: string
      pages:
        description: 'Páginas por categoria (0 = percorrer até o fim)'
        default: '0'
        type: string
      dry_run:
        description: 'Verificar coleta sem escrever no banco'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: catalogo-fornecedores
  cancel-in-progress: false

jobs:
  crawler-sync:
    name: Coletar ${{ matrix.store }}
    runs-on: ${{ vars.CATALOG_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        store: [kabum, pichau, terabyte]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CATEGORY: ${{ inputs.category || '' }}
      PAGES: ${{ inputs.pages || '0' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      STORE: ${{ matrix.store }}
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-crawler.txt
      - name: Verificar configuração
        shell: bash
        run: |
          if [[ "$DRY_RUN" != "true" && -z "$DATABASE_URL" ]]; then
            echo "::error::Configure o secret DATABASE_URL com a conexão PostgreSQL do site."
            exit 1
          fi
      - name: Instalar coletor e navegador
        run: |
          python -m pip install -r requirements-crawler.txt
          python -m playwright install --with-deps chromium
      - name: Testar extração e persistência
        run: python -m unittest discover -s tests -p 'test_catalog*.py'
      - name: Atualizar catálogo
        shell: bash
        run: |
          args=(--all --store "$STORE" --pages "$PAGES" --output "scratch/catalog-$STORE.json")
          if [[ -n "$CATEGORY" ]]; then args+=(--category "$CATEGORY"); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python scripts/crawler_fornecedores.py "${args[@]}"
      - name: Guardar relatório da coleta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalogo-${{ matrix.store }}
          path: scratch/catalog-${{ matrix.store }}.json
          if-no-files-found: ignore
          retention-days: 7
